services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webmana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webmana}
      POSTGRES_DB: ${POSTGRES_DB:-webmana}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webmana}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies Drizzle migrations + TimescaleDB setup, then exits.
  migrate:
    build:
      context: .
      target: runtime
    command: ["pnpm", "--filter", "@webmana/db", "migrate:run"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    command: ["pnpm", "--filter", "@webmana/api", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Required to encrypt/decrypt connector secrets (upsert + run actions).
      WEBMANA_SECRET_KEY: ${WEBMANA_SECRET_KEY}
      # Optional integrations used by the API directly.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: runtime
    command: ["pnpm", "--filter", "@webmana/worker", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEBMANA_SECRET_KEY: ${WEBMANA_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      COST_ANOMALY_THRESHOLD_PCT: ${COST_ANOMALY_THRESHOLD_PCT:-20}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_INSIGHTS_INTERVAL_MS: ${AI_INSIGHTS_INTERVAL_MS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mcp:
    build:
      context: .
      target: runtime
    command: ["pnpm", "--filter", "@webmana/mcp", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_PORT: 4100
      MCP_DEV_TOKEN: ${MCP_DEV_TOKEN:-}
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: runtime
    command: ["pnpm", "--filter", "@webmana/web", "start"]
    environment:
      # Server-side fetches (dashboard) reach the API over the compose network.
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      # AGPL §13: link to the running app's source. Point at your fork if modified.
      NEXT_PUBLIC_SOURCE_URL: ${SOURCE_URL:-https://github.com/WebmanaProject/webmana}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
